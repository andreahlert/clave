[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clave"
version = "0.1.0"
description = "Attested Split Oracle: protect proprietary functions that must run on the client, using a TEE boundary, attestation, and a query budget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andre Ahlert" }]
keywords = ["tee", "enclave", "attestation", "software-protection", "obfuscation", "sgx", "trustzone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/andreahlert/clave"
Issues = "https://github.com/andreahlert/clave/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clave"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
